# markdownlint rules this repository turns off. markdownlint-cli and editors read this file.
MD013: false # line length
MD033: false # inline HTML
MD041: false # first line must be a top-level heading

# CHANGELOG.md follows Keep a Changelog, which repeats "### Added", "### Changed" and so on under
# every release, and Templates/README.md repeats "### StudyTable", "### SeriesTable" and
# "### ImageTable" under every modality. Only flag a heading that repeats one of its siblings.
MD024: { siblings_only: true }
